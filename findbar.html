<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 13px;
        overflow: hidden;
        -webkit-app-region: drag; /* allow dragging the bar */
    }
    /* Dark theme (default) */
    :root {
        --bar-bg: #555555;                            /* clearly lighter than the page bg to lift the card */
        --bar-border: rgba(255, 255, 255, 0.24);        /* visible white outline (shadows are clipped on transparent windows) */
        --bar-shadow: 0 6px 24px rgba(0, 0, 0, 0.7);
        --bar-fg: #ffffff;                             /* pure-white text on the bar */
        --input-bg: #333333;
        --input-fg: #ffffff;                           /* typed text pure white */
        --input-border: rgba(255, 255, 255, 0.2);
        --input-placeholder: rgba(255, 255, 255, 0.65); /* brighter placeholder */
        --input-focus: #7c8cff;
        --count-fg: rgba(255, 255, 255, 0.75);
        --count-err: #ff8585;
        --btn-bg: #5c5c5c;
        --btn-fg: #ffffff;
        --btn-border: rgba(255, 255, 255, 0.2);
        --btn-hover: #6e6e6e;
    }
    /* Light theme — legible on a light app background */
    :root.light {
        --bar-bg: #f5f6f8;
        --bar-border: #c3c8d0;
        --bar-shadow: rgba(0,0,0,0.18);
        --bar-fg: #1e2026;
        --input-bg: #ffffff;
        --input-fg: #1e2026;
        --input-border: #c3c8d0;
        --input-placeholder: rgba(0, 0, 0, 0.45);
        --input-focus: #4c6ef5;
        --count-fg: #5a6472;
        --count-err: #e03131;
        --btn-bg: #e9ebee;
        --btn-fg: #1e2026;
        --btn-border: #c3c8d0;
        --btn-hover: #dde1e6;
    }
    .bar {
        display: flex;
        align-items: center;
        gap: 4px;
        height: 100%;
        padding: 4px 6px;
        background: var(--bar-bg);
        border: 1px solid var(--bar-border);
        border-radius: 6px;
        box-shadow: 0 4px 16px var(--bar-shadow);
        color: var(--bar-fg);
    }
    input {
        flex: 1;
        min-width: 0;
        padding: 4px 8px;
        background: var(--input-bg);
        color: var(--input-fg);
        border: 1px solid var(--input-border);
        border-radius: 4px;
        outline: none;
        -webkit-app-region: no-drag;
        font-family: inherit;
        font-size: 13px;
    }
    input:focus { border-color: var(--input-focus); }
    input::placeholder { color: var(--input-placeholder); opacity: 1; }
    .count {
        font-size: 11px;
        color: var(--count-fg);
        min-width: 42px;
        text-align: center;
        white-space: nowrap;
    }
    .count.err { color: var(--count-err); }
    button {
        width: 24px;
        height: 24px;
        background: var(--btn-bg);
        color: var(--btn-fg);
        border: 1px solid var(--btn-border);
        border-radius: 4px;
        cursor: pointer;
        -webkit-app-region: no-drag;
        font-size: 12px;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    button:hover { background: var(--btn-hover); }
    .close { font-size: 14px; }
</style>
</head>
<body>
    <div class="bar">
        <input type="text" id="q" placeholder="Find in page" autocomplete="off">
        <span class="count" id="count"></span>
        <button id="prev" title="Previous (Shift+Enter)">↑</button>
        <button id="next" title="Next (Enter)">↓</button>
        <button id="close" class="close" title="Close (Esc)">✕</button>
    </div>

    <script>
        const { ipcRenderer } = require('electron');

        const q = document.getElementById('q');
        const countEl = document.getElementById('count');
        const prevBtn = document.getElementById('prev');
        const nextBtn = document.getElementById('next');
        const closeBtn = document.getElementById('close');

        let lastQuery = '';
        let matchCount = 0;
        let activeMatch = 0;

        function doFind(text, forward) {
            if (text === lastQuery && text !== '') {
                // same query → just jump to next/prev
                ipcRenderer.send('find-text', text, forward);
                return;
            }
            lastQuery = text;
            if (!text) {
                countEl.textContent = '';
                countEl.className = 'count';
                ipcRenderer.send('find-clear');
                return;
            }
            ipcRenderer.send('find-text', text, forward !== false);
        }

        q.addEventListener('input', () => doFind(q.value.trim(), true));

        q.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                doFind(q.value.trim(), !e.shiftKey);
            } else if (e.key === 'Escape') {
                e.preventDefault();
                ipcRenderer.send('find-hide-bar');
            }
        });

        prevBtn.addEventListener('click', () => doFind(q.value.trim(), false));
        nextBtn.addEventListener('click', () => doFind(q.value.trim(), true));
        closeBtn.addEventListener('click', () => ipcRenderer.send('find-hide-bar'));

        ipcRenderer.on('find-result', (_e, { activeMatchOrdinal, matches }) => {
            activeMatch = activeMatchOrdinal;
            matchCount = matches;
            if (matches === 0) {
                countEl.textContent = 'No results';
                countEl.className = 'count err';
            } else {
                countEl.textContent = activeMatchOrdinal + '/' + matches;
                countEl.className = 'count';
            }
        });

        // Match the app's theme (dark/light) so the bar stays legible.
        function applyTheme(theme) {
            if (theme === 'light') document.documentElement.classList.add('light');
            else document.documentElement.classList.remove('light');
        }
        ipcRenderer.on('theme-changed', (_e, theme) => applyTheme(theme));

        // Focus the input when the window loads
        window.addEventListener('load', () => {
            q.focus();
            q.select();
        });
    </script>
</body>
</html>
