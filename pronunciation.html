<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pronunciation</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
        font-size: 13px;
        overflow: hidden;
        background: transparent;
    }
    /* Dark theme (default) */
    :root {
        --bar-bg: #2b2d31;
        --bar-border: rgba(255, 255, 255, 0.22);
        --bar-shadow: 0 8px 28px rgba(0, 0, 0, 0.7);
        --bar-fg: #f2f3f5;
        --word-fg: #ffffff;
        --phn-fg: #b9c0c9;
        --phn-mark: #8ea2ff;
        --btn-bg: #3a3d42;
        --btn-fg: #ffffff;
        --btn-border: rgba(255, 255, 255, 0.18);
        --btn-hover: #4a4e55;
        --err-fg: #ff8585;
    }
    /* Light theme */
    :root.light {
        --bar-bg: #ffffff;
        --bar-border: #c3c8d0;
        --bar-shadow: 0 8px 28px rgba(0, 0, 0, 0.18);
        --bar-fg: #1e2026;
        --word-fg: #1e2026;
        --phn-fg: #5a6472;
        --phn-mark: #4c6ef5;
        --btn-bg: #eef0f3;
        --btn-fg: #1e2026;
        --btn-border: #c3c8d0;
        --btn-hover: #e2e6ea;
        --err-fg: #e03131;
    }
    .card {
        display: flex;
        align-items: center;
        gap: 8px;
        max-width: 360px;
        padding: 8px 10px;
        background: var(--bar-bg);
        border: 1px solid var(--bar-border);
        border-radius: 8px;
        box-shadow: 0 6px 20px var(--bar-shadow);
        color: var(--bar-fg);
    }
    .info { min-width: 0; flex: 1; }
    .word {
        color: var(--word-fg);
        font-weight: 600;
        font-size: 14px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .phon {
        color: var(--phn-fg);
        font-size: 12px;
        margin-top: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .phon .ph { color: var(--phn-mark); }
    .phon .pos { opacity: 0.7; margin-right: 4px; }
    .err { color: var(--err-fg); font-size: 12px; margin-top: 2px; }
    button {
        flex: none;
        width: 30px;
        height: 30px;
        background: var(--btn-bg);
        color: var(--btn-fg);
        border: 1px solid var(--btn-border);
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    button:hover { background: var(--btn-hover); }
    button:disabled { opacity: 0.5; cursor: default; }
    .close { font-size: 15px; }
    .spin { animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
    <div class="card">
        <div class="info">
            <div class="word" id="word"></div>
            <div class="phon" id="phon"></div>
        </div>
        <button id="play" title="Play">🔊</button>
        <button id="close" class="close" title="Close (Esc)">✕</button>
    </div>

    <script>
        const { ipcRenderer } = require('electron');

        const wordEl = document.getElementById('word');
        const phonEl = document.getElementById('phon');
        const playBtn = document.getElementById('play');
        const closeBtn = document.getElementById('close');

        let currentText = '';   // text to read aloud
        let dictAudio = null;   // URL of dictionary audio (if any)

        function applyTheme(theme) {
            if (theme === 'light') document.documentElement.classList.add('light');
            else document.documentElement.classList.remove('light');
        }
        ipcRenderer.on('theme-changed', (_e, theme) => applyTheme(theme));

        // main -> panel: show phonetics for a word/sentence
        ipcRenderer.on('pron-show', (_e, data) => {
            currentText = data.text || '';
            dictAudio = data.audioUrl || null;
            wordEl.textContent = currentText;
            if (data.phonetics && data.phonetics.length) {
                phonEl.innerHTML = data.phonetics.map(p =>
                    (p.pos ? `<span class="pos">${escapeHtml(p.pos)}</span>` : '') +
                    (p.text ? `<span class="ph">${escapeHtml(p.text)}</span>` : '')
                ).join('  ');
            } else if (data.note) {
                phonEl.textContent = data.note;
            } else {
                phonEl.textContent = '';
            }
            playBtn.disabled = false;
        });

        // main -> panel: audio data (base64 mp3) ready to play
        ipcRenderer.on('pron-audio', (_e, base64) => {
            playBtn.disabled = false;
            playBtn.classList.remove('spin');
            if (!base64) return;
            const audio = new Audio('data:audio/mp3;base64,' + base64);
            audio.play().catch(() => {});
        });

        playBtn.addEventListener('click', () => {
            if (dictAudio) {
                // play dictionary audio directly (official pronunciation)
                const audio = new Audio(dictAudio);
                audio.play().catch(() => {});
                return;
            }
            if (!currentText) return;
            playBtn.disabled = true;
            playBtn.classList.add('spin');
            ipcRenderer.send('pron-play-tts', currentText);
        });

        closeBtn.addEventListener('click', () => ipcRenderer.send('pron-hide'));
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') ipcRenderer.send('pron-hide');
        });

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => (
                { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
            ));
        }
    </script>
</body>
</html>
